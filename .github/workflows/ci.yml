#
# Pull request and main CI. The jobs (Arch, Lint, Nix) are the shared C++ CI
# of the workspace repository (.github/workflows/cpp-ci.yml), which says what
# each one does. This file passes only what differs here.
#
# phosphor-libs comes from the commit cmake/PhosphorShellLibsDependencies.cmake
# pins, so its tests run here too. Lambent, which builds this tree from a
# pinned commit, tests it again inside its own build. The Nix tests build
# compiles phosphor-libs' suite as well as this tree's, so it gets the
# shared 90 minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@main
    with:
      pin-file: cmake/PhosphorShellLibsDependencies.cmake
      nix-verify: |
        libs=$(find result/lib -maxdepth 1 -name 'libPhosphor*.so*' | wc -l)
        echo "Shared libraries: $libs"
        test "$libs" -gt 0 || { echo "::error::the package installed no libPhosphor*.so"; exit 1; }
        test -e result/lib/cmake/PhosphorTheme || { echo "::error::the package installed no PhosphorTheme CMake package"; exit 1; }
